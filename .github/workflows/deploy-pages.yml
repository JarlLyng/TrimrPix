# Deploy marketingsitet (docs/) til GitHub Pages
# Kører ved push til main når docs/ ændres, eller manuelt
# Repo Settings → Pages → Source: GitHub Actions

name: Deploy marketing site

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sitemap step dates each page by its last commit.
          fetch-depth: 0

      # The shared header and footer are written into every page by
      # tools/sync_partials.py. Fail the deploy rather than shipping pages that
      # have drifted apart.
      - name: Check shared header and footer are in sync
        run: python3 tools/sync_partials.py --check

      # A page under construction marks what it still waits on with data-draft-slot
      # (the owner's photo, a measurement, new captures) or a {{placeholder}}. Never
      # publish one: fail here instead.
      - name: Refuse to deploy draft slots or placeholders
        run: |
          if grep -l -E 'data-draft-slot|\{\{[A-Z_]+\}\}' docs/*.html; then
            echo "These pages still have draft slots or {{placeholders}}; not deploying." >&2
            exit 1
          fi

      # The design system is served from this site's own copy (docs/assets/), not a CDN:
      # its stylesheets block the first paint, and jsDelivr has failed in practice.
      - name: Refuse stylesheets or scripts from a CDN
        run: |
          if grep -n -E '<(link|script)[^>]*(href|src)="https://cdn\.jsdelivr\.net' docs/*.html; then
            echo "A page loads a stylesheet or script from jsDelivr; serve the site's copy instead." >&2
            exit 1
          fi

      # Each page's <lastmod> is the date of the last commit to its file (#96). The
      # committed sitemap has none, so a date is never hand-written or the build date.
      - name: Date the sitemap from git
        run: python3 tools/date_sitemap.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
