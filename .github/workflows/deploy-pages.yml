# Deploy marketingsitet (docs/) til GitHub Pages
# Kører ved push til main når docs/ ændres, eller manuelt
# Repo Settings → Pages → Source: GitHub Actions

name: Deploy marketing site

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rewrite every <lastmod> in sitemap.xml to today's date so search
      # engines see fresh signals on each deploy.
      - name: Refresh sitemap lastmod
        run: |
          today=$(date -u +%Y-%m-%d)
          sed -i -E "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${today}</lastmod>|g" docs/sitemap.xml
          echo "Updated lastmod to ${today}"
          grep -c "<lastmod>${today}</lastmod>" docs/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
