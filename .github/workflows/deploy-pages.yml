# Deploy marketingsitet (docs/) til GitHub Pages
# Kører ved push til main når docs/ ændres, eller manuelt
# Repo Settings → Pages → Source: GitHub Actions

name: Deploy marketing site

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The shared header and footer are written into every page by
      # tools/sync_partials.py. Fail the deploy rather than shipping pages that
      # have drifted apart.
      - name: Check shared header and footer are in sync
        run: python3 tools/sync_partials.py --check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
