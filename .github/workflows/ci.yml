# Build TrimrPix and run tests on PRs and pushes to main.
# Signing is disabled — CI verifies that the code compiles and tests pass,
# not that it produces a distributable build.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 ships the macOS 26 SDK, which is required: MetricsService uses
    # MetricKit payload APIs (MXMetricPayload/MXDiagnosticPayload) that are
    # unavailable in the macOS 15.x SDK shipped with older Xcodes (e.g. 16.2).
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TrimrPix.xcodeproj \
            -scheme TrimrPix \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -skip-testing:TrimrPixUITests
